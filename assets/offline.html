<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
        user-select: none;
        -webkit-user-select: none;
      }
      .overlay-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgba(11, 12, 16, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
        pointer-events: none;
      }
      .overlay-container.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .background-blobs {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        opacity: 0.6;
        pointer-events: none;
      }
      .blobs-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 400px;
        height: 400px;
        transform: translate(-50%, -50%) scale(2);
      }
      .blob {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        filter: blur(60px);
      }
      .blob-pink {
        width: 180px;
        height: 180px;
        background-color: #ff31d7;
        opacity: 0.6;
        animation: float-pink 4s ease-in-out infinite;
      }
      .blob-red {
        width: 200px;
        height: 200px;
        background-color: #ff5c4d;
        opacity: 0.5;
        animation: float-red 4.5s ease-in-out infinite;
      }
      .blob-blue {
        width: 160px;
        height: 160px;
        background-color: #4e8dff;
        opacity: 0.6;
        animation: float-blue 3.5s ease-in-out infinite;
      }
      @keyframes float-pink {
        0%,
        100% {
          transform: translate(-50%, -50%) translate(0, 0) scale(1);
        }
        33% {
          transform: translate(-50%, -50%) translate(30px, -35px) scale(1.2);
        }
        66% {
          transform: translate(-50%, -50%) translate(-25px, 25px) scale(0.85);
        }
      }
      @keyframes float-red {
        0%,
        100% {
          transform: translate(-50%, -50%) translate(0, 0) scale(1);
        }
        33% {
          transform: translate(-50%, -50%) translate(-30px, 25px) scale(1.15);
        }
        66% {
          transform: translate(-50%, -50%) translate(25px, -30px) scale(0.85);
        }
      }
      @keyframes float-blue {
        0%,
        100% {
          transform: translate(-50%, -50%) translate(0, 0) scale(1);
        }
        33% {
          transform: translate(-50%, -50%) translate(25px, 30px) scale(1.15);
        }
        66% {
          transform: translate(-50%, -50%) translate(-30px, -20px) scale(0.9);
        }
      }
      .content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 40px;
        max-width: 800px;
      }
      .title {
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        background: rgba(255, 255, 255, 0.4);
        width: 0;
        transition: width 5s linear;
      }
      .progress-bar.active {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="overlay-container" id="container">
      <div class="background-blobs">
        <div class="blobs-wrapper">
          <div class="blob blob-pink"></div>
          <div class="blob blob-red"></div>
          <div class="blob blob-blue"></div>
        </div>
      </div>
      <div class="content">
        <h1 class="title">We'll be right back</h1>
      </div>
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <script>
      let timer = null;
      const bar = document.getElementById('progressBar');
      const container = document.getElementById('container');

      function cancelHold() {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
        bar.classList.remove('active');
      }

      function startHold() {
        cancelHold();
        bar.classList.add('active');
        timer = setTimeout(dismiss, 5000);
      }

      function show() {
        requestAnimationFrame(() => {
          container.classList.add('visible');
        });
      }

      function hide() {
        cancelHold();
        container.classList.remove('visible');
      }

      function dismiss() {
        hide();
        if (window.eggshell && typeof window.eggshell.invoke === 'function') {
          window.eggshell.invoke('offline:dismiss').catch(() => {});
        }
      }

      window.show = show;
      window.hide = hide;

      if (!window.eggshell) {
        show();
      }

      container.addEventListener('mousedown', startHold);
      container.addEventListener('touchstart', startHold);
      window.addEventListener('mouseup', cancelHold);
      window.addEventListener('touchend', cancelHold);
      window.addEventListener('touchcancel', cancelHold);
      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          dismiss();
        }
      });
    </script>
  </body>
</html>
