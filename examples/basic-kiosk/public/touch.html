<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basic Kiosk - Touch Role</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #0f172a;
        color: #f8fafc;
      }
      h1 {
        color: #38bdf8;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
        font-size: 1.1rem;
        margin: 0.25rem 0;
      }
      .badge {
        display: inline-block;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        background-color: #1e293b;
        border: 1px solid #334155;
        color: #38bdf8;
        font-size: 0.875rem;
        margin-top: 1.25rem;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>Touch Role Window</h1>
    <p>Targeted via display role: <code>touch</code></p>
    <p>Fallback placement: <code>primary</code></p>
    <div class="badge">target: { kind: 'role', role: 'touch' }</div>
  </body>
</html>
